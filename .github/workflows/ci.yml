name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Kept as separate steps rather than `npm run check`, so a red run says
      # which thing broke without anyone opening the log.
      - name: Typecheck the template
        run: npm run typecheck

      - name: Typecheck the demo
        run: npm run typecheck -w deep-ui-demo

      - name: Tests
        run: npm test

      - name: Token discipline
        run: npm run check:tokens

      - name: Palette contrast
        run: npm run check:contrast

      - name: Documented numbers
        run: npm run check:docs

      - name: Build the demo
        run: npm run demo:build
